<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イベント情報｜あにまる出版</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/images/animal-publishing-logo.png" alt="あにまる出版"><span class="brand-name">あにまる出版</span></a><nav class="nav"><a href="../index.html#books">作品一覧</a><a href="../authors/index.html">作者一覧</a><a href="index.html">イベント</a></nav></div></header>
<main><div class="page-intro"><div class="wrap"><div class="eyebrow">EVENTS</div><h1>イベント情報</h1></div></div><section class="section wrap"><h2 class="section-title">今後のイベント</h2><div id="upcoming-events" class="event-list"></div><h2 class="section-title" style="margin-top:48px">過去のイベント</h2><div id="past-events" class="event-list"></div></section></main>
<footer class="site-footer"><div class="wrap"><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/images/animal-publishing-logo.png" alt="あにまる出版"><span class="brand-name">あにまる出版</span></a><p>小説・エッセイなど、手に取りやすい本を制作している小さな出版サークルです。</p><div class="copyright">© あにまる出版</div></div></footer>
<script>fetch("../data/events.json").then(r=>r.json()).then(events=>{const render=e=>`<article class="event-item"><div class="event-date">${e.eventDate||""}</div><div class="event-detail"><h3>${e.eventName}</h3><p>${e.description||""}</p></div></article>`;const up=events.filter(e=>e.status==="公開"),past=events.filter(e=>e.status==="終了");document.getElementById("upcoming-events").innerHTML=up.map(render).join("")||'<p class="empty">現在、参加予定のイベントはありません。</p>';document.getElementById("past-events").innerHTML=past.map(render).join("")||'<p class="empty">過去のイベント情報はありません。</p>';});</script></body></html>
